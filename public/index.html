<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="走這條，一路順！">
<meta name="theme-color" content="#e33710">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}</style>
</head>
<body>
<title>走這條，一路順！</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 手機框 + 旁邊分頁面板（展示／資料來源／落地計畫）；大安區示範，點位用開放資料座標，路線與活動為模擬 */
:root{
  /* 弘道主題色（hondao.org.tw style.css）：#E33710 主色、#F29D86、#ED7D55、#FBDAC8、#3E3A39、#796F66 */
  --bg:#faf7f3; --surface:#ffffff; --ink:#3e3a39; --muted:#6f655c;
  --shade:#e33710; --shade-soft:#fbdac8; --brand-ink:#b8360f; --brand-2:#f29d86;
  --leaf:#1f6b4f; --leaf-soft:#dcefe5;
  --cool:#1c6a86; --cool-soft:#dbeef5;
  --sun:#b45309; --sun-soft:#fbead3;
  --social:#7a3e8e; --social-soft:#f1e3f5;
  --line:#e6d6ca; --frame:#3e3a39;
  --lv0:#3b7a57; --lv1:#a16207; --lv2:#c2410c; --lv3:#b91c1c;
  --lv1-bg:#fdf3c7; --lv2-bg:#fde3cf; --lv3-bg:#fbdada;
  --map-bg:#f3f0e6; --map-road:#ffffff; --map-road-edge:#d8d2c0; --map-park:#cfe5d3; --map-label:#7c7663;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1614; --surface:#241e1b; --ink:#f4eee9; --muted:#bdb0a6;
  --shade:#f29d86; --shade-soft:#43271d; --brand-ink:#f29d86; --brand-2:#ed7d55;
  --leaf:#5fc29a; --leaf-soft:#1d3a2e; --cool:#6cc3e0; --cool-soft:#173440;
  --sun:#f2a24b; --sun-soft:#3a2a16; --social:#d59be6; --social-soft:#33213b;
  --line:#45372f; --frame:#0f0c0b;
  --lv0:#6fc193; --lv1:#e8c04a; --lv2:#f59a5b; --lv3:#f27474;
  --lv1-bg:#3a3214; --lv2-bg:#3d2414; --lv3-bg:#401a1a;
  --map-bg:#26201c; --map-road:#3e3530; --map-road-edge:#302824; --map-park:#24402f; --map-label:#a89c92; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1614; --surface:#241e1b; --ink:#f4eee9; --muted:#bdb0a6;
  --shade:#f29d86; --shade-soft:#43271d; --brand-ink:#f29d86; --brand-2:#ed7d55;
  --leaf:#5fc29a; --leaf-soft:#1d3a2e; --cool:#6cc3e0; --cool-soft:#173440;
  --sun:#f2a24b; --sun-soft:#3a2a16; --social:#d59be6; --social-soft:#33213b;
  --line:#45372f; --frame:#0f0c0b;
  --lv0:#6fc193; --lv1:#e8c04a; --lv2:#f59a5b; --lv3:#f27474;
  --lv1-bg:#3a3214; --lv2-bg:#3d2414; --lv3-bg:#401a1a;
  --map-bg:#26201c; --map-road:#3e3530; --map-road-edge:#302824; --map-park:#24402f; --map-label:#a89c92; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start;max-width:1120px;margin:0 auto}
.intro{width:100%;max-width:1000px;margin:0 auto 18px;text-align:center}
.intro h1{font-family:var(--f-display);font-weight:400;font-size:1.7rem;margin:0 0 6px;text-wrap:balance}
.intro p{margin:0;color:var(--muted);font-size:.95rem;line-height:1.6}
.sim-tag{display:inline-block;background:var(--sun-soft);color:var(--sun);font-weight:700;font-size:.78rem;padding:2px 10px;border-radius:99px;letter-spacing:.05em}

.phone{width:min(390px,100%);height:800px;max-height:calc(100vh - 40px);min-height:620px;background:var(--surface);border:10px solid var(--frame);border-radius:42px;
  overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 20px 50px -20px rgba(0,0,0,.35);font-size:calc(17px * var(--fs,1))}
.sim-strip{background:var(--sun-soft);color:var(--sun);font-size:.68em;text-align:center;padding:4px 8px;font-weight:700;letter-spacing:.04em}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.screen>*{flex-shrink:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--f-display);font-size:1.45em;line-height:1.1}
@media (max-width:380px){.brand{font-size:1.25em}}
.brand small{display:block;font-family:var(--f-body);font-size:.45em;color:var(--muted);margin-top:4px}
.wx{display:flex;align-items:center;gap:8px;background:var(--cool-soft);border:0;border-radius:16px;padding:6px 12px 6px 8px;min-height:56px}
.wx b{font-size:1.5em;font-variant-numeric:tabular-nums}
.wx small{display:block;font-size:.72em;font-weight:700}
.back{display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 14px 8px 8px;min-height:52px;font-weight:700;flex:none}
.title{font-family:var(--f-display);font-size:1.25em;flex:1;min-width:0;line-height:1.25}

.alert{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;border:2px solid currentColor}
.alert .lbl{font-size:.7em;font-weight:700;letter-spacing:.04em;opacity:.9}
.alert p{margin:2px 0 0;font-weight:700;color:var(--ink)}
.lv0{color:var(--lv0);background:var(--shade-soft)}
.lv1{color:var(--lv1);background:var(--lv1-bg)}
.lv2{color:var(--lv2);background:var(--lv2-bg)}
.lv3{color:var(--lv3);background:var(--lv3-bg)}
.care{display:flex;gap:10px;align-items:center;background:var(--cool-soft);border-radius:14px;padding:10px 12px;font-size:.92em}
.care .lbl{font-size:.75em;font-weight:700;color:var(--cool)}

.big{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:22px;padding:18px 16px;min-height:118px;width:100%;color:#fff}
.big .ic{width:66px;height:66px;border-radius:18px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.22);font-size:2.5em}
.big b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.5em}
.big span{font-size:.86em}
.big.cool{background:var(--cool)} .big.shade{background:var(--shade)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .big,:root:not([data-theme="light"]) .go,:root:not([data-theme="light"]) .rest,:root:not([data-theme="light"]) .spk{color:#1a1614}}
:root[data-theme="dark"] .big,:root[data-theme="dark"] .go,:root[data-theme="dark"] .rest,:root[data-theme="dark"] .spk{color:#1a1614}
.minor{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.minor3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.minor3 .small{flex-direction:column;gap:4px;min-height:92px;font-size:1.05em;padding:6px 4px;line-height:1.2}
.big.main{min-height:176px;flex-direction:column;justify-content:center;text-align:center;gap:10px}
.big.main .ic{width:76px;height:76px;font-size:2.9em}
.big.main b{font-size:1.9em}
.big.main .icrow{justify-content:center}
.big .bigsub{display:block;font-size:.95em;margin-top:6px;opacity:.95}
.vias{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.88em}
.vias .chip.done{opacity:.55;text-decoration:line-through}
.small{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:16px;min-height:60px;font-weight:700;padding:6px 10px;text-align:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85em;align-self:center;padding:8px}

.card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px;min-height:96px}
.thumb{width:72px;height:72px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:.66em;color:var(--muted);text-align:center;line-height:1.2;padding:4px}
.card h3{margin:0 0 4px;font-size:1.02em}
.meta{display:flex;flex-wrap:wrap;gap:5px;font-size:.78em}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;background:var(--bg);font-weight:500}
.walk{margin-left:auto;text-align:center;flex:none;font-variant-numeric:tabular-nums}
.walk b{font-size:1.5em;display:block;line-height:1}
.walk small{font-size:.72em;color:var(--muted)}
.src-real{background:var(--leaf-soft);color:var(--leaf);font-weight:700}
.src-est{background:var(--sun-soft);color:var(--sun);font-weight:700}
.src-sim{background:var(--bg);color:var(--muted);border:1px dashed var(--muted)}
.src-na{background:var(--bg);color:var(--muted);border:1px dotted var(--muted)}
.act{background:var(--social-soft);color:var(--social);font-weight:700}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:14px;min-height:64px;font-weight:700;line-height:1.25;padding:6px}
.seg button[aria-pressed="true"]{border-color:var(--shade);background:var(--shade-soft);color:var(--brand-ink)}
.seg small{display:block;font-weight:500;font-size:.76em;color:var(--muted)}
.map{border-radius:18px;overflow:hidden;border:2px solid var(--line);background:var(--map-bg)}
.map>svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.74em;color:var(--muted);padding:6px 10px;border-top:1px solid var(--line);background:var(--surface)}
.legend i{display:inline-block;width:24px;height:0;vertical-align:middle;margin-right:4px}
.cmp{width:100%;border-collapse:collapse;font-size:.84em}
.cmp th,.cmp td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{font-weight:500;color:var(--muted);width:30%}
.cmp td{font-weight:700;font-variant-numeric:tabular-nums}
.cmp .win{color:var(--leaf)}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.summary .chip{font-size:.85em;padding:4px 10px;background:var(--surface);border:1.5px solid var(--line)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:52px 40px 1fr;align-items:center;gap:8px;padding:6px 0;position:relative}
.timeline li::before{content:"";position:absolute;left:71px;top:0;bottom:0;border-left:3px dotted var(--line);z-index:0}
.timeline .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82em;text-align:right}
.timeline .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);z-index:1}
.timeline .d{min-width:0}
.timeline .d b{display:block;font-size:.92em}
.timeline .d small{font-size:.72em}
details.why{border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.84em}
details.why summary{font-weight:700;cursor:pointer;min-height:36px;display:flex;align-items:center}
.formula{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border-radius:8px;padding:8px;font-size:.92em;overflow-x:auto;white-space:nowrap}
.go{border:0;border-radius:18px;background:var(--shade);color:#fff;font-weight:900;font-size:1.2em;min-height:66px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.sticky{position:sticky;bottom:-20px;background:linear-gradient(transparent,var(--surface) 30%);padding-top:12px;margin-top:auto}

.navcard{border-radius:22px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.navcard.sh{background:var(--leaf-soft)} .navcard.ex{background:var(--sun-soft)}
.arrow{width:104px;height:104px}
.navcard h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.45em;text-wrap:balance}
.navcard .dist{font-size:1.1em;font-weight:700;font-variant-numeric:tabular-nums}
.exposure{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9em;padding:4px 12px;border-radius:99px;background:var(--surface)}
.spk{width:58px;height:58px;border-radius:50%;border:0;background:var(--cool);color:#fff;display:grid;place-items:center;flex:none;font-size:1.5em}
.big .icrow{display:flex;gap:12px;font-size:1.35em;margin-top:8px}
.alert .big-ic{font-size:2em;display:inline-flex}
.alert small{display:block;font-size:.72em;color:var(--muted);margin-top:3px;font-weight:500}
.whyhot{margin-top:6px}
.whyhot summary{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:99px;border:2px solid currentColor;font-weight:700;font-size:.85em;cursor:pointer;list-style:none}
.whyhot summary::-webkit-details-marker{display:none}
.whyhot p{font-weight:500!important;font-size:.85em;color:var(--ink);margin:6px 0 0}
.navbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.navbtns button{min-height:60px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.rest{border:0;border-radius:16px;background:var(--cool);color:#fff;min-height:60px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.progress{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--shade)}

.sheet{position:absolute;inset:auto 0 0 0;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 16px 22px;box-shadow:0 -10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px;z-index:5;max-height:85%;overflow-y:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:4}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.3em}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:2px solid var(--line);border-radius:14px}
.sw{width:64px;height:36px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--shade)} .sw[aria-checked="true"]::after{left:32px}
.note{font-size:.78em;color:var(--muted);margin:0;line-height:1.5}

/* panel */
.panel{flex:1 1 320px;max-width:470px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-size:.92rem;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.panel h4{margin:0 0 6px;font-size:.8rem;letter-spacing:.06em;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:.9rem}
.opts button[aria-pressed="true"]{border-color:var(--shade);background:var(--shade-soft);color:var(--brand-ink);font-weight:700}
.panel p{margin:0;font-size:.86rem;color:var(--muted);line-height:1.6}
.panel ol,.panel ul{margin:0;padding-left:1.2em;font-size:.88rem;line-height:1.65}
.panel li+li{margin-top:2px}
.tblwrap{overflow-x:auto}
.dtbl{width:100%;border-collapse:collapse;font-size:.82rem;min-width:420px}
.dtbl th,.dtbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.45}
.dtbl th{color:var(--muted);font-weight:500;font-size:.76rem;letter-spacing:.04em}
.dtbl a{color:var(--cool)}
.phase{border-left:4px solid var(--shade);padding:4px 0 4px 12px}
.phase b{display:block;font-size:.95rem}
.phase.p2{border-color:var(--cool)} .phase.p3{border-color:var(--social)}
/* 平板橫向：標題縮成一行，手機與面板都不用捲動 */
@media (min-width:900px) and (max-height:920px){
  body{padding-block:8px 8px}
  .intro{margin-bottom:8px;display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:nowrap;max-width:1120px}
  .intro h1{font-size:1.15rem;margin:0;flex:none}
  .intro p{font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .phone{height:calc(100vh - 70px);max-height:none;min-height:560px}
  .panel{max-height:calc(100vh - 70px);overflow-y:auto}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:440px){.phone{border-width:0;border-radius:18px;height:auto;min-height:0;max-height:none}.screen{overflow:visible}.sticky{bottom:0}}
/* 正式入口（?app 或從主畫面開啟）：只有 App，沒有 Demo 控制 */
body.app-mode{padding:0}
body.app-mode .intro,body.app-mode .panel,body.app-mode .panel-scrim,body.app-mode .sim-open,body.app-mode .sim-full{display:none!important}
body.app-mode .sim-short{display:inline!important}
body.app-mode .wrap{display:block}
body.app-mode .phone{width:100%;max-width:560px;margin:0 auto;height:100vh;height:100dvh;max-height:none;min-height:0;border:0;border-radius:0;box-shadow:none}
body.app-mode .screen{overflow-y:auto}
body.app-mode .sticky{bottom:-20px}
body.app-mode .sim-strip{font-size:.62em;padding:4px 8px}
.fsrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fsrow button{min-height:56px;border:2px solid var(--line);background:var(--surface);border-radius:14px;font-weight:700}
.fsrow button[aria-pressed="true"]{border-color:var(--shade);background:var(--shade-soft);color:var(--brand-ink)}
/* 手機模式：只顯示 App；說明與控制面板收進上方橫條的按鈕 */
.sim-open,.panel-close,.panel-scrim,.sim-short{display:none}
@media (max-width:600px){.sim-short{display:inline}}
@media (max-width:600px){
  body{padding:0}
  .intro{display:none}
  .wrap{display:block}
  .phone{width:100%;height:100vh;height:100dvh;max-height:none;min-height:0;border:0;border-radius:0;box-shadow:none}
  .screen{overflow-y:auto}
  .sticky{bottom:-20px}
  .sim-strip{display:flex;align-items:center;gap:8px;font-size:.62em;padding:4px 8px 4px 12px;text-align:left}
  .sim-strip .sim-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sim-strip .sim-full{display:none}
  .sim-open{display:inline-flex;align-items:center;gap:4px;flex:none;border:1.5px solid currentColor;background:var(--surface);color:var(--sun);border-radius:99px;padding:4px 10px;font-weight:700;font-size:1.1em;min-height:32px}
  .panel{display:none;position:fixed;left:0;right:0;bottom:0;max-width:none;max-height:82vh;max-height:82dvh;overflow-y:auto;z-index:30;border-radius:20px 20px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.3)}
  body.show-panel .panel{display:flex}
  body.show-panel .panel-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:29}
  .panel-close{display:flex;justify-content:space-between;align-items:center;font-weight:700}
  .panel-close button{border:0;background:var(--bg);border-radius:12px;min-height:44px;padding:0 16px;font-weight:700}
}

function go(v){stopAuto();S.stack.push(v);S.step=0;render(true)}
function back(){stopAuto();if(cur()==='nav'&&S.ctx)delete S.ctx.via;if(S.stack.length>1)S.stack.pop();render(true)}
// ---------- 模擬走路：自動前進＋語音（正式版改由 GPS 觸發） ----------
let T=null;
function stopAuto(){S.auto=false;clearTimeout(T);T=null;try{speechSynthesis.cancel()}catch(e){}}
function stepSpeech(r,i){const st=stats(r),s=st.segs[i],dk=isDark(),full=S.navMode==='full',out=[];
 if(i===0)out.push(full?'出發了。':'出發了，需要注意的地方我會提醒你。');
 if(full)out.push(s.txt.replace(/（.*?）/g,'')+'。');
 if(!full&&s.via)out.push('先去'+s.stop.name+'。');
 if(!full&&s.rejoin)out.push('回到原來的路，繼續走。');
 if(s.hz)out.push('前面施工，'+s.hz.replace(/^假設/,'').replace(/（.*?）/g,'')+'。');
 const prevH=i>0?st.segs[i-1].hots.map(h=>h.name):[];
 if(s.hots.some(h=>!prevH.includes(h.name)))out.push('前面路口，小心轉彎車，車停了再走。'+(S.time===5?'綠燈亮了，先看左右。':''));
 if(dk&&!s.lit)out.push('這段比較暗，慢慢走。');
 if(!dk&&full&&S.lv>=2&&!shOn(s))out.push('這段會曬，走慢一點。');
 return out.join('')}
function speakThen(t,cb){
 let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(T);T=setTimeout(cb,1000)};
 if(!t){T=setTimeout(cb,2200);return}
 try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.85;u.onend=fin;u.onerror=fin;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
 T=setTimeout(fin,Math.max(2500,t.length*300))}
function autoStep(){if(!S.auto||cur()!=='nav')return;const r=routeOf(),n=stats(r).segs.length;
 speakThen(stepSpeech(r,S.step),()=>{if(!S.auto||cur()!=='nav')return;
  if(S.step<n-1){S.step++;render();if(stats(r).segs[S.step].rest){S.auto=false;render();speakThen(S.say,()=>{});return}autoStep()}
  else{S.auto=false;S.sheet='done';render();speakThen('到了，記得喝水，坐下來休息。',()=>{})}})}

// route helpers
function routeOf(){const c=S.ctx;if(!c)return null;if(c.via)return c.via;if(c.type==='dest')return S.mode==='friendly'?friendlyOf(c.d):c.d[S.mode];return c.route}
function destName(){const c=S.ctx;return !c?'':c.type==='dest'?c.d.n:c.type==='quick'?c.target.name:c.p.n}
// 天暗時，依真實路燈資料比較「走公園」與「走大路」，分數低者推薦
const nightPick=d=>stats(d.friendly).weight<=stats(d.safe).weight?d.friendly:d.safe;
const friendlyOf=d=>isDark()?nightPick(d):d.friendly;
const recMode=d=>stats(d.normal).weight<stats(friendlyOf(d)).weight?'normal':'friendly';
function near(segs,ll,m){return segs.some(s=>{for(let i=0;i<=10;i++){const q=[s.from[0]+(s.to[0]-s.from[0])*i/10,s.from[1]+(s.to[1]-s.from[1])*i/10];if(dist(q,ll)<=m)return true}return false})}
function stats(r){
 const dk=isDark();
 let prev=START,tot=0,sun=0,dark=0,lampN=0,arcM=0;const segs=r.segs.map(s=>{const d=dist(prev,s.to);const m=segM(prev,s.to);const wk=worksNear(prev,s.to);const hz=s.hz||(wk.length?workTxt(wk[0]):'');const o={...s,from:prev,d,lamp:m.n,kw:m.kw,arc:m.arc,works:wk,hz,hzSim:s.hz?s.hzSim:0,lit:hz?false:d?m.kw/d*100>=LIT_CUT:true};tot+=d;lampN+=m.n;arcM+=d*m.arc;if(!dk&&!s.sh[S.time])sun+=d*(1-m.arc);if(dk&&!o.lit)dark+=d;prev=s.to;return o});
 const DH=HOTS.filter(h=>h.n>=DANGER_N); // 只有危險路口會提醒、影響路線
 segs.forEach(o=>{o.hots=DH.filter(h=>near([o],h.ll,40))});
 const hots=DH.filter(h=>near(segs,h.ll,40));
 const hz=segs.filter(s=>s.hz).length;
 const exp=tot?sun/tot:0,dexp=tot?dark/tot:0;
 const weight=Math.round(dk?tot*(1+dexp*2)+hz*200+hots.length*300:tot*(1+exp*HEATK[S.lv])+hz*200+hots.length*150+(r.stairs||0)*150);
 return {segs,tot,sun,dark,min:Math.max(1,Math.round(tot/WALK)),sunMin:Math.round(sun/WALK),darkMin:Math.round(dark/WALK),shadePct:Math.round((1-exp)*100),litPct:Math.round((1-dexp)*100),lampN,arcM:Math.round(arcM),hz,hots,weight,
  wc:r.fac.filter(f=>f.k==='wc'),acc:r.fac.filter(f=>f.k==='wc').reduce((a,f)=>a+(f.acc||0),0),seats:r.fac.filter(f=>f.k==='seat').length,water:r.fac.filter(f=>f.k==='water').length};
}
// minute along route for each facility: nearest segment point
function facMinute(r,f){const st=stats(r);let best=1e9,acc=0,at=0;st.segs.forEach(s=>{for(let i=0;i<=10;i++){const p=[s.from[0]+(s.to[0]-s.from[0])*i/10,s.from[1]+(s.to[1]-s.from[1])*i/10];const d=dist(p,f.ll);if(d<best){best=d;at=acc+s.d*i/10}}acc+=s.d});return {min:Math.max(1,Math.round(at/WALK)),off:best}}

// 走路中「我要休息一下」：找離目前位置最近的廁所／飲水／可以坐的地方，加進路線（A → 停靠點 → B）
const STOPK={wc:['我要上廁所','上完廁所'],water:['我要喝水','喝點水'],seat:['我要坐一下','坐下休息']};
function nearStop(k,p){let pool;
 if(k==='wc')pool=TOILETS.map(t=>({k:'wc',name:t[0],ll:[t[1],t[2]],src:'real',acc:t[4],par:t[5]}));
 else if(k==='water')pool=WATERS.map(w=>({k:'water',name:w[0],ll:[w[1],w[2]],src:'real',cnt:w[3],open:w[4]})).concat(COOLS.filter(c=>c[8]).map(c=>({k:'water',name:c[0],ll:[c[2],c[3]],src:'real',open:c[4]})));
 else pool=(S.ctx.via||routeOf()).fac.filter(f=>f.k==='seat').concat(COOLS.filter(c=>c[7]).map(c=>({k:c[5]?'cool':'seat',name:c[0],ll:[c[2],c[3]],src:'real',open:c[4]})));
 const best=pool.map(x=>({...x,d:dist(p,x.ll)})).sort((a,b)=>a.d-b.d)[0];
 return best?{...best,min:Math.max(1,Math.round(best.d*1.3/WALK))}:null}
function addStop(k){const r=routeOf(),i=S.step,st=stats(r),o=r.segs[i],c=nearStop(k,st.segs[i].from);if(!c)return null;
 const back=o.txt.startsWith('回到原來的路')?o.txt:'回到原來的路，'+o.txt;
 const segs=r.segs.slice(0,i).concat([{to:c.ll,sh:o.sh,txt:`往${c.name}走`,via:1,stop:c,want:k},{to:c.ll,sh:o.sh,txt:`在${c.name}休息`,rest:1,stop:c,want:k},{...o,txt:back,rejoin:1}],r.segs.slice(i+1));
 S.ctx.via={segs,fac:r.fac.concat([c]),stairs:r.stairs||0};return c}
const viaBar=st=>{const v=st.segs.map((s,i)=>({s,i})).filter(x=>x.s.rest);if(!v.length)return '';
 return `<div class="vias"><b>途中加入</b>${v.map(x=>`<span class="chip ${x.i<S.step?'done':''}">${facDot(x.s.stop.k,1)} ${x.s.stop.name}${x.i<S.step?' ✓':''}</span>`).join('')}</div>`};
// ---------- pieces ----------
const header=t=>`<div class="topbar"><button class="back" data-a="back" aria-label="返回上一頁">${I.back}返回</button><div class="title">${t}</div>${spk()}</div>`;
function wxChip(){const L=LV[S.lv],dk=isDark();return `<button class="wx" data-a="settings" aria-label="天氣與提醒設定"><span style="color:${dk?'var(--cool)':'var(--sun)'};font-size:1.6em">${dk?I.moon:I.sun}</span><span><b>${dk?L.t-(S.time===5?9:5):L.t}°C</b><small style="color:${dk?'var(--cool)':'var(--'+L.k+')'}">${dk?(S.time===5?'清晨':'晚上'):L.short}</small></span></button>`}
function officialAlert(){const L=LV[S.lv];if(!L.off||isDark())return '';
 return `<div class="alert ${L.k}" role="status"><span class="big-ic">${I.sun}</span><div><div class="lbl">氣象署・${L.n}（模擬）</div><p>${L.msg}</p></div></div>`}
function careTip(){
 let ic,t;
 if(isDark()){if(S.time===5){ic=I.tlight;t='綠燈亮了，先看左右'}else{ic=I.car;t='小心轉彎車'}}
 else if(S.lv>=2&&S.time===13){ic=I.sun;t='最熱時段，4 點後再出門'}
 else if(S.lv>=1){ic=I.water;t='先喝水，常休息'}
 else{ic=I.water;t='記得帶水'}
 return `<div class="care"><span class="big-ic" style="color:var(--cool);font-size:2em;display:inline-flex">${ic}</span><div><div class="lbl">APP 提醒</div><b style="font-size:1.1em">${t}</b></div></div>`}
const facDot=(k,s)=>{const f=FAC[k];return `<span style="color:${f.c};font-size:${s||1.3}em;display:inline-flex" aria-hidden="true">${I[f.ic]}</span>`};
function facDetail(f){if(f.k==='wc')return `${f.name}・${f.acc?`無障礙 ${f.acc} 座`:'無無障礙座'}${f.par?`・親子 ${f.par}`:''}`;if(f.k==='water')return `${f.name}${f.cnt?`・飲水機 ${f.cnt} 台`:'・飲水'}`;return f.name}

function mapSVG(r,opts){
 opts=opts||{};
 const pt=ll=>P(ll[0],ll[1]).map(v=>v.toFixed(1)).join(',');
 const [px0,py0]=P(121.5335,25.0330),[px1,py1]=P(121.5378,25.0262);
 let g=`<rect x="${px0}" y="${py0}" width="${px1-px0}" height="${py1-py0}" rx="8" fill="var(--map-park)"/>`;
 g+=`<text x="${(px0+px1)/2}" y="${(py0+py1)/2+4}" font-size="10" text-anchor="middle" fill="var(--map-label)">大安森林公園</text>`;
 const roads=[['h',25.0333,'信義路'],['h',25.0258,'和平東路'],['v',121.5335,'新生南路'],['v',121.5378,'建國南路'],['v',121.5437,'復興南路'],['v',121.5270,'金山南路']];
 roads.forEach(rd=>{if(rd[0]==='h'){const y=P(0,rd[1])[1];g+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--map-road-edge)" stroke-width="9"/><line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--map-road)" stroke-width="6"/><text x="4" y="${y-6}" font-size="9" fill="var(--map-label)">${rd[2]}</text>`}
  else{const x=P(rd[1],0)[0];g+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--map-road-edge)" stroke-width="9"/><line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--map-road)" stroke-width="6"/><text x="${x+3}" y="${H-6}" font-size="9" fill="var(--map-label)">${rd[2]}</text>`}});
 const dk0=isDark();
 if(dk0)LAMPS.forEach(l=>{const [x,y]=P(l[0],l[1]);if(x>-2&&x<W+2&&y>-2&&y<H+2)g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.3" fill="var(--sun)" opacity=".6"/>`});
 else ARCS.forEach(r=>{g+=`<polygon points="${r.map(ll=>P(ll[0],ll[1]).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="var(--leaf)" opacity=".35"/>`});
 WORKS.forEach(w=>w.g.forEach(pt=>{const pts=pt.c.map(ll=>P(ll[0],ll[1]).map(v=>v.toFixed(1)).join(',')).join(' ');g+=pt.k==='p'?`<polygon points="${pts}" fill="var(--lv2)" fill-opacity=".35" stroke="var(--lv2)" stroke-width="1.5" stroke-dasharray="3 2"/>`:`<polyline points="${pts}" fill="none" stroke="var(--lv2)" stroke-width="3" stroke-dasharray="3 2" opacity=".8"/>`}));
 // all toilets faint
 if(opts.allWc)TOILETS.forEach(t=>{const [x,y]=P(t[1],t[2]);g+=`<circle cx="${x}" cy="${y}" r="3" fill="var(--muted)" opacity=".45"/>`});
 const dk=isDark();
 const drawRoute=(rt,ghost)=>{const st=stats(rt);let s='';st.segs.forEach((sg,i)=>{const on=dk?sg.lit:shOn(sg);const active=cur()==='nav'&&i===S.step&&!ghost;
  s+=`<polyline points="${pt(sg.from)} ${pt(sg.to)}" fill="none" stroke="${ghost?'var(--muted)':dk?(on?'var(--cool)':'var(--muted)'):(on?'var(--leaf)':'var(--sun)')}" stroke-width="${ghost?4:active?11:8}" stroke-linecap="round" ${ghost?'stroke-dasharray="1 7" opacity=".7"':on?'':'stroke-dasharray="2 13"'} />`;
  if(sg.hz&&!ghost){const m=P((sg.from[0]+sg.to[0])/2,(sg.from[1]+sg.to[1])/2);s+=`<g transform="translate(${m[0]-11},${m[1]-26})"><rect width="22" height="22" rx="5" fill="var(--lv2)"/><g transform="translate(3,3)" style="color:#fff">${I.hazard.replace('width="1em" height="1em"','width="16" height="16"')}</g></g>`}});return s};
 HOTS.forEach(h=>{const [x,y]=P(h.ll[0],h.ll[1]),d=h.n>=DANGER_N,z=d?8:6;g+=`<g transform="translate(${x},${y})"><rect x="-${z}" y="-${z}" width="${2*z}" height="${2*z}" rx="3" transform="rotate(45)" fill="${hotLv(h).c}" stroke="var(--surface)" stroke-width="2"/><text y="${d?4.5:3.5}" font-size="${d?12:9}" font-weight="900" text-anchor="middle" fill="#fff">!</text></g>`});
 if(opts.ghost)g+=drawRoute(opts.ghost,true);
 if(r)g+=drawRoute(r,false);
 if(r)r.fac.forEach(f=>{const F=FAC[f.k];const [x,y]=P(f.ll[0],f.ll[1]);g+=`<g transform="translate(${x-13},${y-13})"><circle cx="13" cy="13" r="14" fill="var(--surface)" stroke="${F.c}" stroke-width="2.5" ${f.src==='est'?'stroke-dasharray="3 2"':''}/><g transform="translate(4,4)" style="color:${F.c}">${I[F.ic].replace('width="1em" height="1em"','width="18" height="18"')}</g></g>`});
 // destination pin
 if(opts.dest){const [x,y]=P(opts.dest[0],opts.dest[1]);g+=`<g transform="translate(${x-12},${y-30})"><path d="M12 0a12 12 0 0 1 12 12c0 9-12 20-12 20S0 21 0 12A12 12 0 0 1 12 0z" fill="var(--lv3)"/><circle cx="12" cy="12" r="4.5" fill="#fff"/></g>`}
 // me
 let me=START;if(cur()==='nav'&&r){me=stats(r).segs[S.step].from}
 const [mx,my]=P(me[0],me[1]);g+=`<circle cx="${mx}" cy="${my}" r="9" fill="var(--cool)" stroke="#fff" stroke-width="3.5"/>`;
 if(cur()!=='nav')g+=`<text x="${mx-6}" y="${my+22}" font-size="11" font-weight="700" fill="var(--ink)" text-anchor="middle">你在這</text>`;
 return `<div class="map"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="大安區路線示意圖">${g}</svg>
  <div class="legend">${dk?'<span><i style="border-top:6px solid var(--cool)"></i>路燈較多</span><span><i style="border-top:6px dotted var(--muted)"></i>較暗</span><span><b style="color:var(--sun)">•</b> 路燈（2017 資料）</span>':'<span><i style="border-top:6px solid var(--leaf)"></i>有遮蔭</span><span><i style="border-top:6px dotted var(--sun)"></i>曝曬</span><span><b style="color:var(--leaf);opacity:.6">■</b> 整平騎樓</span>'}<span><b style="color:var(--lv2)">▨</b> 今日施工</span><span><b style="color:var(--lv1)">◆</b> 觀察路口（地圖標示）</span><span><b style="color:var(--lv3)">◆</b> 危險路口</span>${opts.ghost?'<span><i style="border-top:4px dotted var(--muted)"></i>一般地圖路線</span>':''}<span>點位為真實座標，道路簡化示意</span></div></div>`;
}

 <p class="note">臺北市涼適點、民間涼適點、環境部 Cool Map 合作涼爽點。合作涼爽點為便利商店、超市等，標示「涼適點」者不消費也可入內休息；開放時間以現場為準。</p>`}

 ${S.lv===3&&!isDark()?`<div class="alert lv3"><span style="font-size:1.4em">${I.hazard}</span><div><p>現在很熱，建議選最近的地方，不要走太遠。</p></div></div>`:''}
 <p class="note">活動時間為模擬；正式版接社會局關懷據點與長青學苑課表。</p>`;

dest(){
 S.say='你要去哪裡？按一個地方。路上想上廁所、喝水或休息，走路時按「我要休息一下」就可以加進去。';
 return `${header('我要去那裡')}
 <div class="minor">${DESTS.map(d=>`<button class="small" style="min-height:84px;font-size:1.02em" data-a="dest:${d.id}">${d.n}</button>`).join('')}</div>
 <button class="small" data-a="dest:market">說出地點（語音，示意）</button>
 <p class="note">常去的地方排在最前面，不需要打字。</p>`;
},
quick(){
 const k=S.ctx.k;
 const pool=k==='wc'?TOILETS.map(t=>({name:t[0],ll:[t[1],t[2]],acc:t[4],par:t[5],type:t[6]})):WATERS.map(w=>({name:w[0],ll:[w[1],w[2]],cnt:w[3],open:w[4]}));
 const rows=pool.map(x=>({...x,d:dist(START,x.ll)})).sort((a,b)=>(S.accOnly&&k==='wc'?(b.acc>0)-(a.acc>0):0)||a.d-b.d).filter(x=>!(S.accOnly&&k==='wc'&&!x.acc)).slice(0,4);
 S.say=rows.length?`最近的${k==='wc'?'廁所':'飲水機'}在${rows[0].name}，走${Math.max(1,Math.round(rows[0].d*1.3/WALK))}分鐘。`:'';
 return `${header(k==='wc'?'最近的廁所':'最近的飲水機')}
 ${k==='wc'?`<div class="seg"><button aria-pressed="${!S.accOnly}" data-a="acc:0">全部</button><button aria-pressed="${!!S.accOnly}" data-a="acc:1">只看無障礙</button></div>`:''}
 ${mapSVG(null,{allWc:k==='wc'})}
 ${rows.map((x,i)=>`<button class="card" data-a="qgo:${i}" style="min-height:80px">${facDot(k,2)}<span style="min-width:0;flex:1"><h3>${x.name}</h3><span class="meta">${k==='wc'?`<span class="chip">${x.type}</span><span class="chip">${x.acc?`無障礙 ${x.acc} 座`:'無無障礙座'}</span>`:`<span class="chip">${x.cnt} 台</span><span class="chip">${x.open}</span>`}${src('real')}</span></span><span class="walk"><b>${Math.max(1,Math.round(x.d*1.3/WALK))}</b><small>分鐘</small></span></button>`).join('')}
 <p class="note">${k==='wc'?'臺北市公廁點位資訊（環保局）。資料沒有開放時間，夜間是否可用需另外確認。':'臺北市公共場所飲水機資訊（環保局）。資料沒有故障狀態欄位。'}</p>`;
},
route(){
 const c=S.ctx,r=routeOf(),st=stats(r);
 const name=c.type==='dest'?c.d.n:c.type==='quick'?c.target.name:c.p.n;
 const destLL=c.type==='dest'?c.d.ll:c.type==='quick'?c.target.ll:c.p.ll;
 let cmp='';
 if(c.type==='dest'){
  const a=stats(c.d.normal),b=stats(friendlyOf(c.d)),dk=isDark();
  const row=(lbl,va,vb,better)=>`<tr><th>${lbl}</th><td class="${better==='a'?'win':''}">${va}</td><td class="${better==='b'?'win':''}">${vb}</td></tr>`;
  cmp=`<div class="seg"><button aria-pressed="${S.mode==='normal'}" data-a="mode:normal">最短<small>${recMode(c.d)==='normal'?'推薦 ✓':'一般地圖'}</small></button><button aria-pressed="${S.mode==='friendly'}" data-a="mode:friendly">${dk?I.lamp+' 安全':I.tree+' 長者友善'}<small>${recMode(c.d)==='friendly'?'推薦 ✓':'&nbsp;'}</small></button></div>
  <table class="cmp"><tr><th></th><td style="color:var(--muted);font-weight:500">最短</td><td style="color:var(--muted);font-weight:500">${dk?'安全':'長者友善'}</td></tr>
  ${row(I.walk+' 時間',a.min+' 分',b.min+' 分',a.min<b.min?'a':'b')}
  ${dk?row(I.moon+' 較暗',a.darkMin+' 分',b.darkMin+' 分',a.darkMin<b.darkMin?'a':b.darkMin<a.darkMin?'b':''):row(I.sun+' 曬太陽',a.sunMin+' 分',b.sunMin+' 分',a.sunMin<b.sunMin?'a':'b')}
  ${row(I.hazard+' 小心路口',a.hots.length+' 處',b.hots.length+' 處',a.hots.length<b.hots.length?'a':b.hots.length<a.hots.length?'b':'')}
  ${row(I.seat+' 座椅',a.seats+' 處',b.seats+' 處',b.seats>a.seats?'b':'')}
  ${row(I.wc+' 無障礙廁',a.acc+' 座',b.acc+' 座',b.acc>a.acc?'b':a.acc>b.acc?'a':'')}
  ${row(I.cone+' 施工',a.hz?a.hz+' 處':'無',b.hz?b.hz+' 處':'無',a.hz>b.hz?'b':'')}</table>
  ${dk?`<div class="care"><span class="big-ic" style="color:var(--cool);font-size:2em;display:inline-flex">${I.moon}</span><div><b>${recMode(c.d)==='normal'?'天暗：這次最短的路路燈就夠，直接走':friendlyOf(c.d)===c.d.friendly?'天暗：公園步道路燈比較多，走公園':'天暗：避開施工，走路燈多的大路'}</b><small style="display:block;color:var(--muted)">依臺北市路燈資料計算</small></div></div>`:''}`;
 }
 const fac=r.fac.map(f=>({f,...facMinute(r,f)})).sort((x,y)=>x.min-y.min);
 const hzs=st.segs.filter(s=>s.hz);
 S.say=`去${name}，走${st.min}分鐘。${isDark()?(st.darkMin?'天暗了，有一段路燈比較少，慢慢走。':'天暗了，這條路一路都有路燈。'):(st.shadePct>=50?'大部分有遮蔭。':'有些路段會曬。')}${st.hots.length?'路上有一個要注意的路口，小心轉彎車。':''}準備好就按開始走。`;
 return `${header('去 '+name)}
 ${cmp}
 <div class="summary"><span class="chip">${I.walk} ${st.min} 分・${st.tot} 公尺</span>${isDark()?`<span class="chip" style="color:var(--cool)">${I.lamp} 沿路路燈 ${st.lampN} 盞・亮的路段 ${st.litPct}% ${src('real')}</span>`:`<span class="chip" style="color:var(--leaf)">${I.tree} 遮蔭約 ${st.shadePct}% ${src('est')}</span>${st.arcM?`<span class="chip" style="color:var(--leaf)">騎樓約 ${st.arcM} 公尺 ${src('real')}</span>`:''}`}</div>
 ${mapSVG(r,{dest:destLL,ghost:c.type==='dest'&&S.mode==='friendly'?c.d.normal:null})}
 ${hzs.map(s=>`<div class="alert lv2"><span style="font-size:1.3em">${I.hazard}</span><div><div class="lbl">${I.cone} ${s.hzSim?'示範情境（假設）':'道路施工・'+WORKS_AT}</div><p>${s.hz}</p></div></div>`).join('')}
 ${st.hots.map(h=>`<div class="alert ${hotLv(h).k}"><span class="big-ic">${I.car}</span><div style="flex:1"><div class="lbl">${I.hazard} ${hotLv(h).t}${h.sim?'・示範情境（假設）':''}</div><p style="font-size:1.1em">小心轉彎車</p><details class="whyhot"><summary>為什麼？</summary><p>${hotWhy(h)}</p></details></div></div>`).join('')}
 ${S.time===5?`<div class="care"><span style="font-size:2em;display:inline-flex;color:var(--ink)">${I.tlight}</span><div><b style="font-size:1.1em">綠燈亮了，先看左右</b><small style="display:block;color:var(--muted)">清晨車輛較常闖紅燈</small></div></div>`:''}
 ${!isDark()&&S.lv>=2&&st.shadePct<50?`<div class="alert ${LV[S.lv].k}"><span style="font-size:1.3em">${I.sun}</span><div><p style="font-size:1.1em">這條路比較曬</p></div></div>`:''}
 <div><div class="note" style="font-weight:700;color:var(--ink);margin-bottom:4px;font-size:1em">${facDot('seat',1.2)} 路上可以休息</div>
 <ul class="timeline">${fac.length?fac.map(x=>`<li><span class="t">${x.min} 分鐘</span><span class="dot">${facDot(x.f.k,1.15)}</span><span class="d"><b>${facDetail(x.f)}</b>${x.off>60?`<small>離路線約 ${x.off} 公尺</small> `:''}${src(x.f.src)}</span></li>`).join(''):'<li><span></span><span></span><span class="note">沿途沒有已知的休息點</span></li>'}</ul></div>
 <details class="why"><summary>為什麼推薦這條路？</summary>
  <p class="note" style="margin:6px 0">${isDark()?`路線分數越低越好。天色較暗時不看遮蔭，改看路燈多寡，並加重避開長者事故路口。路燈：路線兩側 ${BUF} 公尺內的路燈；每 100 公尺低於 ${LIT_CUT} 瓩算較暗（示範路段的第 25 百分位，暫定，非照度標準）。`:`路線分數越低越好。曬太陽的路段會依今天的熱度加重計算，施工路段和長者事故路口另外加分。騎樓：路線兩側 ${BUF} 公尺內有整平騎樓的長度，全天算有遮蔭。`}</p>
  <div class="formula">${isDark()?'分數 = 距離 × (1 + 較暗比例 × 2) + 通報 × 200 + 事故路口 × 300':'分數 = 距離 × (1 + 曝曬比例 × 熱度係數) + 通報 × 200 + 事故路口 × 150'}</div>
  <p class="note" style="margin-top:6px">${c.type==='dest'?`一般地圖 ${stats(c.d.normal).weight} 分，${isDark()?'安全優先':'長者友善'} ${stats(friendlyOf(c.d)).weight} 分。`:`這條路 ${st.weight} 分。`}${isDark()?'':`熱度係數 ${HEATK[S.lv]}（依燈號）。`}係數為草案，需與專家校正。</p>
 </details>
 <div class="sticky"><button class="go" data-a="go:nav">${I.walk} 開始走</button></div>`;
},
nav(){
 const r=routeOf(),st=stats(r),s=st.segs[S.step],dk=isDark(),on=dk?s.lit:shOn(s),last=S.step===st.segs.length-1;
 const dx=s.to[0]-s.from[0],dy=-(s.to[1]-s.from[1]);const ang=Math.atan2(dx,-dy)*180/Math.PI;
 let acc=0;for(let i=0;i<S.step;i++)acc+=st.segs[i].d;const nowMin=acc/WALK;
 const nxt=r.fac.map(f=>({f,...facMinute(r,f)})).filter(x=>x.min>nowMin).sort((a,b)=>a.min-b.min)[0];
 const destN=destName();
 if(s.rest){const verb=STOPK[s.want][1];
  S.say=`到${s.stop.name}了。慢慢來，${verb}，好了再按「繼續走」，我會帶你回原來的路，繼續去${destN}。`;
  return `${header('休息一下')}
  <div class="progress" aria-label="第 ${S.step+1} 段，共 ${st.segs.length} 段"><span style="width:${(S.step+1)/st.segs.length*100}%"></span></div>
  ${viaBar(st)}
  <div class="navcard sh"><span style="display:inline-flex">${facDot(s.stop.k,4)}</span><h2>到了：${s.stop.name}</h2><div class="dist">${verb}，好了再繼續去 ${destN}</div>${s.stop.open?`<span class="chip">${s.stop.open}</span>`:''}</div>
  ${mapSVG(r,{})}
  <button class="go" data-a="resume">▶ 休息好了，繼續走</button>
  <div class="navbtns"><button data-a="say">${I.speaker} 再說一次</button><button data-a="call">${I.phone} 打給家人</button></div>
  <p class="note">若覺得頭暈、噁心或很喘，請先停下，並打電話給家人或 119。</p>`}
 S.say=`${s.txt}，大約${s.d}公尺。${dk?(on?'這段路燈多。':'這段比較暗，慢慢走。'):(on?'這段'+shWhy(s)+'。':'這段會曬。')}${s.hots.length?'前面路口要小心轉彎車，車停了再走。':''}`;
 return `${header('走路中')}
 ${viaBar(st)}
 <div class="progress" aria-label="第 ${S.step+1} 段，共 ${st.segs.length} 段"><span style="width:${(S.step+1)/st.segs.length*100}%"></span></div>
 <div class="navcard ${on?'sh':'ex'}">
  <svg class="arrow" viewBox="0 0 100 100" style="transform:rotate(${ang.toFixed(0)}deg)" aria-hidden="true"><path d="M50 8L84 48H62v44H38V48H16z" fill="${dk?(on?'var(--cool)':'var(--muted)'):(on?'var(--leaf)':'var(--sun)')}"/></svg>
  <h2>${s.txt}</h2>
  <div class="dist">約 ${s.d} 公尺・${Math.max(1,Math.round(s.d/WALK))} 分鐘</div>
  <span class="exposure" style="color:${dk?(on?'var(--cool)':'var(--muted)'):(on?'var(--leaf)':'var(--sun)')}">${dk?(on?I.lamp+' 路燈多':I.moon+' 較暗，慢慢走'):(on?I.tree+' '+shWhy(s):I.sun+' 會曬')}</span>
 </div>
 ${s.hz?`<div class="alert lv2"><span style="font-size:1.3em">${I.hazard}</span><div><div class="lbl">${I.cone} ${s.hzSim?'示範情境（假設）':'道路施工・'+WORKS_AT}</div><p>${s.hz}</p></div></div>`:''}
 ${s.hots.length?`<div class="alert ${hotLv(s.hots[0]).k}"><span class="big-ic">${I.car}</span><div><div class="lbl">${I.hazard} 前面是${hotLv(s.hots[0]).t}${s.hots[0].sim?'・示範情境（假設）':''}</div><p style="font-size:1.1em">小心轉彎車，車停了再走</p>${S.time===5?`<small>${I.tlight} 清晨常有車闖紅燈，綠燈亮了先看左右</small>`:''}</div></div>`:''}
 ${mapSVG(r,{})}
 ${nxt&&!last?`<div class="care">${facDot(nxt.f.k,1.5)}<div>前面約 ${Math.max(1,Math.round(nxt.min-nowMin))} 分鐘有 <b>${facDetail(nxt.f)}</b> ${src(nxt.f.src)}</div></div>`:''}
 <div class="seg"><button aria-pressed="${S.navMode==='alert'}" data-a="nmode:alert">${I.bell} 只提醒<small>熟悉的路</small></button><button aria-pressed="${S.navMode==='full'}" data-a="nmode:full">${I.walk} 每個轉彎<small>第一次去</small></button></div>
 <button class="go" data-a="auto" style="background:${S.auto?'var(--sun)':'var(--shade)'}">${S.auto?'⏸ 暫停':(S.step>0?'▶ 繼續走':'▶ 模擬走路')}</button>
 <div class="navbtns"><button data-a="say">${I.speaker} 再說一次</button><button data-a="rest">${facDot('seat',1.4)} 我要休息一下</button></div>
 <p class="note">正式版由 GPS 自動前進，以語音和震動提醒，不用邊走邊看手機。這裡用「模擬走路」示範。</p>`;
}
};

 if(S.sheet==='settings'){const p=S.push;
  const sw=(k,t,d)=>`<div class="toggle"><div><b>${t}</b><p class="note">${d}</p></div><button class="sw" role="switch" aria-checked="${p[k]}" aria-label="${t}" data-a="sw:${k}"></button></div>`;

 if(S.sheet==='red')return `<div class="scrim" data-a="close"></div><div class="sheet" role="alertdialog" aria-label="紅色高溫資訊" style="background:var(--lv3-bg)"><h3 style="color:var(--lv3)">${I.hazard} 今天非常熱</h3>

  ${opts.map(o=>`<button class="card" data-a="via:${o.k}" style="min-height:84px">${facDot(o.k,2)}<span style="min-width:0;flex:1"><h3>${o.t}</h3><span class="meta"><span class="chip">${o.c.name}</span>${src(o.c.src)}</span></span><span class="walk"><b>${o.c.min}</b><small>分鐘</small></span></button>`).join('')}
  <p class="note">若覺得頭暈、噁心或很喘，請先停下，並打電話給家人或 119。</p>
  <button class="small" data-a="close">先不用，繼續走</button></div>`}
 if(S.sheet==='call')return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-label="打給家人"><h3>${I.phone} 打給家人</h3>
  <button class="go" style="background:var(--cool)" data-a="close">${I.phone} 打給 女兒（模擬）</button>

 if(S.sheet==='done')return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog"><h3>${I.tree} 到了！</h3><p style="margin:0">記得喝點水、坐下休息一下。</p><button class="go" data-a="home">回首頁</button></div>`;
 return '';
}

 else if(a==='quick'){S.ctx={type:'qlist',k:v};S.accOnly=false;go('quick')}

 else if(a==='qgo'){const k=S.ctx.k;
   const pool=k==='wc'?TOILETS.map(t=>({name:t[0],ll:[t[1],t[2]],acc:t[4],par:t[5],type:t[6]})):WATERS.map(w=>({name:w[0],ll:[w[1],w[2]],cnt:w[3],open:w[4]}));
   const rows=pool.map(x=>({...x,d:dist(START,x.ll)})).sort((x,y)=>x.d-y.d).filter(x=>!(S.accOnly&&k==='wc'&&!x.acc));
   const t=rows[+v];
   const f=k==='wc'?{k:'wc',name:t.name,ll:t.ll,src:'real',acc:t.acc,par:t.par}:{k:'water',name:t.name,ll:t.ll,src:'real',cnt:t.cnt};
   const mid=[t.ll[0],START[1]];
   S.ctx={type:'quick',k,target:t,route:{segs:[{to:mid,sh:{9:1,13:0,17:1},txt:'沿路直走'},{to:t.ll,sh:{9:0,13:1,17:0},txt:'轉彎後直走，抵達'}],fac:[f]}};
   go('route')}
 else if(a==='cgo'){const c=COOLS[+v],ll=[c[2],c[3]],mid=[ll[0],START[1]];
   S.ctx={type:'quick',k:'cool',target:{name:c[0],ll},route:{segs:[{to:mid,sh:{},txt:'沿路直走'},{to:ll,sh:{},txt:'轉彎後直走，抵達'}],fac:[{k:'cool',name:c[0],ll,src:'real'}]}};

 else if(a==='mode'){S.mode=v;render()}
 else if(a==='auto'){if(S.auto){stopAuto();render()}else{S.auto=true;render();autoStep()}}
 else if(a==='nmode'){S.navMode=v;render()}

 else if(a==='resume'){S.step++;S.auto=true;render();autoStep()}

function loadWorks(){if(location.protocol!=='https:'||/claude\.ai|claudeusercontent/.test(location.hostname))return;

  const now=new Date(),roc=(now.getFullYear()-1911)*10000+(now.getMonth()+1)*100+now.getDate(),num=v=>{const m=String(v||'').split('/').map(Number);return m.length===3?m[0]*10000+m[1]*100+m[2]:NaN};
  const box=[121.5245,25.0232,121.5455,25.0362],seen={},out=[];
  (j.features||[]).forEach(f=>{const p=f.properties||{},c=(f.geometry||{}).coordinates;if(!c)return;const ll=tm2ToLL(+c[0],+c[1]);
   if(ll[0]<box[0]||ll[0]>box[2]||ll[1]<box[1]||ll[1]>box[3])return;
   const cb=num(p.Cb_Da),ce=num(p.Ce_Da);if(cb&&roc<cb||ce&&roc>ce)return;
   const k=[p.Addr,p.Co_Ti,p.Cb_Da,p.Ce_Da].join('|');let w=seen[k];
   if(!w){w=seen[k]={a:String(p.Addr||'').trim(),t:String(p.Co_Ti||'').trim(),d:`${p.Cb_Da}–${p.Ce_Da}`,b:p.IsBlock==='是',u:p.NPurp||'',g:[]};out.push(w)}
   const pos=p.Positions||[],cv=r=>r.map(q=>tm2ToLL(+q[0],+q[1]));
   if(p.Positions_type==='MultiLineString')pos.forEach(l=>l.length>1&&w.g.push({k:'l',c:cv(l)}));
   else if(p.Positions_type==='MultiPolygon')pos.forEach(pg=>pg&&pg[0]&&w.g.push({k:'p',c:cv(pg[0])}))});
